name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Install System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt install build-essential bison flex libsndfile1-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev meson ninja-build
      
      - name: Checkout Chuck
        uses: actions/checkout@v6
        with:
          repository: ccrma/chuck
          path: chuck

      - name: Build and Install ChucK - Linux
        if: runner.os == 'Linux'
        run: |
          cd chuck/src
          make linux-all
          mkdir ..bin
          mv chuck ..bin/
          echo "$(pwd)/..bin" >> $GITHUB_PATH

      - name: Checkout Chump
        if: runner.os == 'Linux'
        uses: actions/checkout@v6
        with:
          repository: ccrma/chump
          path: chump

      - name: Build and Install Chumpinate - Linux
        if: runner.os == 'Linux'
        run: |
          cd chump
          make linux
          sudo make install

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and Install ChuckTestSuite
        run: |
          ch ChuckTestSuite
          make
          make install

      - name: Run Tests
        run: |
          chuck examples/TestRunner.ck

      - name: Upload ZIP
        uses: actions/upload-artifact@v6
        with:
          path: ChuckTestSuite.zip